spring:
    application:
        name: gateway-service
    #Đăng ký định tuyến động
    cloud:
        config:
            enabled: false
        gateway:
            server:
                webflux:
                    discovery:
                        locator:
                            enabled: true
                            lower-case-service-id: true
#Đặt port
server:
    port: 8080
#Đăng ký với eureka server
eureka:
    client:
        register-with-eureka: true
        fetch-registry: true
        service-url:
            defaultZone: http://eureka-service:8761/eureka/
    instance:
        prefer-ip-address: true
